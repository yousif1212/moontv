<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon TV - Professional P2P Streaming</title>
    <!-- WebTorrent Library -->
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <style>
        :root {
            --bg-color: #141414;
            --accent-red: #e50914;
            --card-bg: #1f1f1f;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            padding-bottom: 50px;
        }

        header {
            position: sticky;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            color: var(--accent-red);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        .search-container input {
            padding: 10px 15px;
            width: 280px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-container button {
            padding: 10px 20px;
            background-color: var(--accent-red);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 40px;
        }

        .player-section {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
            border: 1px solid #333;
        }

        .player-section.active { display: block; }
        .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-player { background: #333; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }

        video { width: 100%; max-height: 550px; background: #000; border-radius: 4px; }
        
        .status-bar {
            margin-top: 15px;
            padding: 12px;
            background: #111;
            border-radius: 4px;
            font-size: 14px;
            color: var(--text-muted);
            border-left: 4px solid var(--accent-red);
        }

        .section-title { font-size: 22px; margin-bottom: 20px; color: #e5e5e5; }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .movie-card:hover { transform: scale(1.04); }
        .movie-card img { width: 100%; height: 260px; object-fit: cover; background: #222; }
        .movie-info { padding: 10px; }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .movie-year { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            .container { padding: 0 15px; }
            .search-container input { width: 150px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="fetchTrendingMedia()">MOON TV</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search movies, TV shows..." onkeyup="if(event.key === 'Enter') searchMedia()">
            <button onclick="searchMedia()">Search</button>
        </div>
    </header>

    <div class="container">
        <div class="player-section" id="playerSection">
            <div class="player-header">
                <h2 id="playingTitle" style="font-size: 18px;">Loading Stream...</h2>
                <button class="close-player" onclick="closePlayer()">Close</button>
            </div>
            <div class="status-bar" id="statusBar">Initializing P2P WebTorrent...</div>
            <video id="videoPlayer" controls autoplay></video>
        </div>

        <h2 class="section-title" id="gridTitle">Trending Worldwide (TMDB Library)</h2>
        <div class="movies-grid" id="moviesGrid">
            <div style="color: var(--text-muted);">Loading full media library via secure proxy...</div>
        </div>
    </div>

    <script>
        const TMDB_KEY = '84b03629470b88025f305f6e8260e66e';
        const client = new WebTorrent();
        let currentTorrent = null;

        window.onload = function() {
            fetchTrendingMedia();
        };

        async function fetchTrendingMedia() {
            document.getElementById('gridTitle').innerText = "Trending Worldwide (TMDB Library)";
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '<div style="color: var(--text-muted);">Loading catalog...</div>';

            try {
                // استخدام بروكسي وسيط لتجاوز أي حظر شبكي على الطلب
                const targetUrl = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}`;
                const res = await fetch(`https://api.allorigins.win/get?url=` + encodeURIComponent(targetUrl));
                const wrapper = await res.json();
                const data = JSON.parse(wrapper.contents);

                if (data.results && data.results.length > 0) {
                    renderGrid(data.results);
                } else {
                    grid.innerHTML = '<div style="color: red;">No catalog items found.</div>';
                }
            } catch (err) {
                console.error("TMDB Fetch Error:", err);
                grid.innerHTML = '<div style="color: red;">Failed to connect to TMDB library. Check network restrictions.</div>';
            }
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('gridTitle').innerText = `Search Results for: "${query}"`;
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '<div style="color: var(--text-muted);">Searching global library...</div>';

            try {
                const targetUrl = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                const res = await fetch(`https://api.allorigins.win/get?url=` + encodeURIComponent(targetUrl));
                const wrapper = await res.json();
                const data = JSON.parse(wrapper.contents);

                if (data.results && data.results.length > 0) {
                    renderGrid(data.results);
                } else {
                    grid.innerHTML = '<div style="color: var(--text-muted);">No results found in global library.</div>';
                }
            } catch (err) {
                console.error("Search Error:", err);
                grid.innerHTML = '<div style="color: red;">Search request failed.</div>';
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                if (!item.poster_path) return;

                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').split('-')[0];
                const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
                const id = item.id;

                const card = document.createElement('div');
                card.className = 'movie-card';

                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${title}" loading="lazy">
                    <div class="movie-info">
                        <div class="movie-title">${title}</div>
                        <div class="movie-year">${year} • ${mediaType.toUpperCase()}</div>
                    </div>
                `;

                card.onclick = () => resolveAndStream(id, title, mediaType);
                grid.appendChild(card);
            });
        }

        async function resolveAndStream(tmdbId, title, mediaType) {
            const playerSection = document.getElementById('playerSection');
            const playingTitle = document.getElementById('playingTitle');
            const statusBar = document.getElementById('statusBar');
            const videoPlayer = document.getElementById('videoPlayer');

            playerSection.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            playingTitle.innerText = `Streaming: ${title}`;
            statusBar.innerText = "🔍 Resolving IMDb metadata from TMDB...";
            videoPlayer.src = "";

            if (currentTorrent) {
                client.remove(currentTorrent.magnetURI);
                currentTorrent = null;
            }

            try {
                const extTarget = `https://api.themoviedb.org/3/${mediaType}/${tmdbId}/external_ids?api_key=${TMDB_KEY}`;
                const extRes = await fetch(`https://api.allorigins.win/get?url=` + encodeURIComponent(extTarget));
                const extWrapper = await extRes.json();
                const extData = JSON.parse(extWrapper.contents);
                const imdbId = extData.imdb_id;

                if (!imdbId) {
                    statusBar.innerText = "❌ Error: Could not resolve IMDb ID for this title.";
                    return;
                }

                statusBar.innerText = `⚡ Scraping P2P streams for IMDb: ${imdbId}...`;

                const scraperUrl = `https://torrentio.strem.fun/stream/${mediaType}/${imdbId}.json`;
                const scraperRes = await fetch(scraperUrl);
                const scraperData = await scraperRes.json();

                if (!scraperData.streams || scraperData.streams.length === 0) {
                    statusBar.innerText = "❌ No active P2P streams found for this title yet.";
                    return;
                }

                const bestStream = scraperData.streams[0];
                const infoHash = bestStream.infoHash;
                const magnetURI = `magnet:?xt=urn:btih:${infoHash}&dn=${encodeURIComponent(title)}`;

                statusBar.innerText = `🚀 Connecting to P2P Swarm & Buffering (Zero Ads)...`;

                client.add(magnetURI, function (torrent) {
                    currentTorrent = torrent;
                    statusBar.innerText = `▶️ Live Streaming: ${torrent.name} (Peers: ${torrent.numPeers})`;

                    const file = torrent.files.find(f => f.name.endsWith('.mp4') || f.name.endsWith('.mkv') || f.name.endsWith('.webm'));
                    if (file) {
                        file.renderTo(videoPlayer, { autoplay: true });
                    } else {
                        statusBar.innerText = "⚠️ Error: Compatible video format not found in this stream.";
                    }
                });

            } catch (err) {
                console.error("Streaming Error:", err);
                statusBar.innerText = "⚠️ Failed to stream this title. Try another one.";
            }
        }

        function closePlayer() {
            const playerSection = document.getElementById('playerSection');
            const videoPlayer = document.getElementById('videoPlayer');
            playerSection.classList.remove('active');
            videoPlayer.pause();
            videoPlayer.src = "";
            if (currentTorrent) {
                client.remove(currentTorrent.magnetURI);
                currentTorrent = null;
            }
        }
    </script>
</body>
</html>
